  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden fixed top-16 left-0 w-full bg-gray-900 text-white flex flex-col space-y-2 p-4 md:hidden">
    <a href="home.html" class="hover:text-red-500">Home</a>
    <a href="about.html" class="hover:text-red-500">About</a>

  <!-- Header -->
  <header class="bg-gradient-to-r from-red-600 to-blue-600 text-black text-center py-20 mt-16">
    <h1 class="text-4xl md:text-5xl font-bold mb-2">Contact Us</h1>
    <p class="text-lg md:text-xl">Let’s build something amazing together.</p>
  </header>

  <!-- Contact Form & Info -->
  <section class="container mx-auto px-4 py-12 grid md:grid-cols-2 gap-12">
    
    <!-- Form -->
    <form id="contact-form" class="space-y-6 bg-gray-800 p-6 rounded-lg shadow-lg">
      <div>
        <label for="name" class="block mb-1 font-medium">Name</label>
        <input type="text" id="name" name="name" required
               class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="Your Name">
      </div>
      <div>
        <label for="email" class="block mb-1 font-medium">Email</label>
        <input type="email" id="email" name="email" required
               class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500" placeholder="you@example.com">
      </div>
      <div>
        <label for="message" class="block mb-1 font-medium">Message</label>
        <textarea id="message" name="message" required
                  class="w-full p-3 rounded bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500" rows="5" placeholder="Your message..."></textarea>
      </div>

      <!-- Buttons -->
      <div class="flex flex-wrap gap-4">
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white py-3 px-6 rounded flex items-center gap-2">
          Send Message
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
          </svg>
        </button>
        <a href="https://wa.me/2347035157216" target="_blank"
           class="bg-green-600 hover:bg-green-700 text-white py-3 px-6 rounded flex items-center gap-2">
           WhatsApp Us
           <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
             <path d="M21.5 2.5a11.949 11.949 0 00-19.9 15.5L2 22l4-1 1.5-1.5A11.949 11.949 0 0021.5 2.5zM17.2 15.7c-.2.6-1.1 1.1-1.6 1.2-.4.1-.9.1-2-.4-1-.4-1.7-.5-2.6-1.1-.9-.5-1.5-1.2-1.7-1.6-.2-.4-.2-.8 0-1.1.2-.3.4-.5.6-.8.2-.3.2-.5 0-.9-.2-.3-1-.9-1.3-1.2-.3-.3-.6-.4-.8-.5-.2 0-.5-.1-.8-.1s-.7.1-1 .3c-.3.2-.5.6-.6 1-.1.3 0 .6.1.9s.7 1.7 1.6 2.8c.9 1 3.1 4.8 7.6 6.5 1 .3 1.8.5 2.4.5.8 0 1.7-.3 2.3-1 .6-.6 1-1.3 1.1-2 .1-.6-.3-1.2-.5-1.5z"/>
           </svg>
        </a>
      </div>
    </form>

    <!-- Map -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Our Location</h2>
      <iframe
        src="https://www.google.com/maps/embed?pb=PASTE_EMBED_CODE_HERE"
        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>

  </section>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/2347035157216" target="_blank"
     class="fixed bottom-6 right-6 bg-green-600 hover:bg-green-700 p-4 rounded-full shadow-lg flex items-center justify-center z-50 animate-bounce">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.5 2.5a11.949 11.949 0 00-19.9 15.5L2 22l4-1 1.5-1.5A11.949 11.949 0 0021.5 2.5zM17.2 15.7c-.2.6-1.1 1.1-1.6 1.2-.4.1-.9.1-2-.4-1-.4-1.7-.5-2.6-1.1-.9-.5-1.5-1.2-1.7-1.6-.2-.4-.2-.8 0-1.1.2-.3.4-.5.6-.8.2-.3.2-.5 0-.9-.2-.3-1-.9-1.3-1.2-.3-.3-.6-.4-.8-.5-.2 0-.5-.1-.8-.1s-.7.1-1 .3c-.3.2-.5.6-.6 1-.1.3 0 .6.1.9s.7 1.7 1.6 2.8c.9 1 3.1 4.8 7.6 6.5 1 .3 1.8.5 2.4.5.8 0 1.7-.3 2.3-1 .6-.6 1-1.3 1.1-2 .1-.6-.3-1.2-.5-1.5z"/>
    </svg>

  <!-- Scripts -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
   <script>
    // Mobile menu toggle
    const btn = document.getElementById('mobile-menu-btn');
    const menu = document.getElementById('mobile-menu');
    btn.addEventListener('click', () => menu.classList.toggle('hidden'));
  </script>
 <script>
    const form = document.getElementById('contact-form');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const data = new FormData(form);

      try {
        const res = await fetch('https://formspree.io/f/yourFormID', {
          method: 'POST',
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          alert('✔️ Message sent!');
          form.reset();
          grecaptcha.reset();
        } else {
          const { error } = await res.json();
          alert(error || 'Submission failed. Please try again.');
        }
      } catch {
        alert('Network error. Try again later.');
      }
    });
  </script>

</body>
